name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Check that the committed dist/ is the build output
        run: |
          set -eu
          # A consumer installs dist/ from the tagged commit, so a stale dist/ ships stale files.
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ differs from a fresh build. Run 'bun run build' and commit dist/."
            git status --short -- dist
            exit 1
          fi
          n=$(git ls-files dist | wc -l)
          echo "dist/ matches the build: $n tracked files compared"
          test "$n" -ge 15
      - run: bun test
      - name: Install the browser
        run: bunx playwright-core install --with-deps chromium
      - name: Browser check at 1280 px and 390 px
        run: bun run test:browser
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: test/out/
          if-no-files-found: warn
          retention-days: 14
