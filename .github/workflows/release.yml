name: release

# Two ways to start it, with the same checks:
# - Push a v* tag. The workflow builds the package and attaches it to a GitHub release.
# - Run it by hand on main (Actions > release > Run workflow). The workflow creates the tag vX.Y.Z from
#   package.json at the head of main, then builds and releases. A tag created this way does not start a second run.
# Consumers install the tag itself: bun add github:PeteDio-Labs/toonish-ui#vX.Y.Z

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach the tarball
      checks: read    # read the ci result for the tagged commit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check the tag, the version and the changelog agree
        run: |
          set -eu
          version=$(bun -e 'console.log(require("./package.json").version)')
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            test "$GITHUB_REF" = "refs/heads/main" || { echo "run this workflow on main, not on $GITHUB_REF"; exit 1; }
            tag="v$version"
          fi
          test "$tag" = "v$version" || { echo "tag $tag does not match package.json version $version"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          echo "release notes: $(wc -l < release-notes.md) lines for $version"
          # The tag must be on main, so a release never ships unreviewed code.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$tag is not on main"; exit 1; }
      - name: Require a green ci run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          out=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" --jq '[.check_runs[] | select(.name == "check")] | map(.conclusion) | join(",")')
          echo "ci check runs on $GITHUB_SHA: [${out}]"
          case "$out" in *success*) ;; *) echo "no successful ci check run on $GITHUB_SHA; merge through a green pull request before tagging"; exit 1 ;; esac
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Check that the committed dist/ is the build output
        run: |
          set -eu
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ differs from a fresh build; the tag is on a stale dist/."
            git status --short -- dist
            exit 1
          fi
      - run: bun test
      - name: Install the browser
        run: bunx playwright-core install --with-deps chromium
      - name: Browser check
        run: bun run test:browser
      - name: Pack
        run: |
          set -eu
          npm pack --pack-destination .
          ls -l toonish-ui-*.tgz
          sha256sum toonish-ui-*.tgz | tee SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md toonish-ui-*.tgz SHA256SUMS
          else
            # The tag does not exist yet: create it at the commit this run built.
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md toonish-ui-*.tgz SHA256SUMS
          fi
          gh release view "$TAG" --json assets --jq '.assets | length' | xargs -I{} echo "release has {} assets"
