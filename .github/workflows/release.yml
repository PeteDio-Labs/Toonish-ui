name: release

# A push of a v* tag builds the package, checks it, and attaches it to a GitHub release.
# Consumers install the tag itself: bun add github:PeteDio-Labs/toonish-ui#vX.Y.Z

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and attach the tarball
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check the tag, the version and the changelog agree
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          version=$(bun -e 'console.log(require("./package.json").version)')
          test "$tag" = "v$version" || { echo "tag $tag does not match package.json version $version"; exit 1; }
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          echo "release notes: $(wc -l < release-notes.md) lines for $version"
          # The tag must be on main, so a release never ships unreviewed code.
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$tag is not on main"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - name: Check that the committed dist/ is the build output
        run: |
          set -eu
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "dist/ differs from a fresh build; the tag is on a stale dist/."
            git status --short -- dist
            exit 1
          fi
      - run: bun test
      - name: Pack
        run: |
          set -eu
          npm pack --pack-destination .
          ls -l toonish-ui-*.tgz
          sha256sum toonish-ui-*.tgz | tee SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md toonish-ui-*.tgz SHA256SUMS
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets | length' | xargs -I{} echo "release has {} assets"
